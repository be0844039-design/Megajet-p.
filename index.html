<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MegaJet OS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #020617; color: #f8fafc; }
        .tech-panel { background: linear-gradient(180deg, #0f172a 0%, #020617 100%); border: 1px solid #1e293b; }
        .neon-blue { border: 1px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .neon-amber { border: 1px solid #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="h-screen flex flex-col p-6 overflow-hidden">
    <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-8">
        <div>
            <h1 class="text-lg font-extrabold tracking-tighter text-white uppercase">MegaJet <span class="text-blue-500">OS</span></h1>
            <p class="text-[9px] text-slate-500 font-bold tracking-[0.2em]">MATRIX V4.1 LIVE</p>
        </div>
        <div id="status-light" class="w-3 h-3 rounded-full bg-red-600 status-pulse"></div>
    </header>

    <div id="login-zone" class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full">
        <p class="text-[10px] text-slate-600 uppercase text-center mb-4 tracking-widest">Encrypted Terminal Access</p>
        <input type="password" id="pin-input" placeholder="0000" class="w-full bg-slate-900 border border-slate-700 p-6 rounded-2xl text-center text-4xl tracking-[0.5em] focus:neon-blue focus:outline-none transition-all mb-4 placeholder:text-slate-800">
        <button onclick="auth()" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all">Connect</button>
    </div>

    <div id="dash-zone" class="hidden flex-1 flex flex-col space-y-4">
        <div class="tech-panel p-4 rounded-2xl border-l-4 border-l-blue-500 mb-2">
            <span class="text-[9px] text-slate-500 uppercase">System Operator</span>
            <p id="op-name" class="text-xl font-bold text-white tracking-tight">---</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="showMatrix()" class="tech-panel neon-blue p-8 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition-all">
                <svg class="w-8 h-8 text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                <span class="text-[9px] font-bold uppercase tracking-widest text-blue-400">Matrix</span>
            </button>
            <button class="tech-panel neon-amber p-8 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition-all">
                <svg class="w-8 h-8 text-amber-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span class="text-[9px] font-bold uppercase tracking-widest text-amber-400">Fault</span>
            </button>
        </div>
    </div>

    <div id="matrix-zone" class="hidden fixed inset-0 bg-slate-950 z-50 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-blue-500 font-bold text-sm uppercase">Technical Matrix</h2>
            <button onclick="hideMatrix()" class="text-slate-600 text-xs font-bold">[ CLOSE ]</button>
        </div>
        <div class="space-y-4">
            <div class="border border-slate-800 rounded-xl p-4 bg-slate-900/40">
                <h3 class="text-xs font-bold text-white mb-2 uppercase border-b border-slate-800 pb-2">MegaJet System</h3>
                <div class="grid grid-cols-2 text-[10px] gap-y-2">
                    <span class="text-slate-500 uppercase">Intensifier</span><span class="text-blue-300 text-right">MJ-INT-800</span>
                    <span class="text-slate-500 uppercase">Encoder</span><span class="text-blue-300 text-right">X-SYNC-PRC</span>
                </div>
            </div>
            <div class="border border-slate-800 rounded-xl p-4 bg-slate-900/40">
                <h3 class="text-xs font-bold text-white mb-2 uppercase border-b border-slate-800 pb-2">Grasselli</h3>
                <div class="grid grid-cols-2 text-[10px] gap-y-2">
                    <span class="text-slate-500 uppercase">Cutter Belt</span><span class="text-blue-300 text-right">GR-BELT-V3</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CODES = { "1214": "Lead Tech", "1001": "Cade", "1000": "Csmall" };
        function auth() {
            const input = document.getElementById('pin-input');
            const user = CODES[input.value];
            if (user) {
                document.getElementById('op-name').innerText = user;
                document.getElementById('login-zone').classList.add('hidden');
                document.getElementById('dash-zone').classList.remove('hidden');
                document.getElementById('status-light').classList.replace('bg-red-600', 'bg-blue-400');
            } else {
                input.style.borderColor = "#dc2626";
                setTimeout(() => { input.style.borderColor = ""; input.value = ""; }, 500);
            }
        }
        function showMatrix() { document.getElementById('matrix-zone').classList.remove('hidden'); }
        function hideMatrix() { document.getElementById('matrix-zone').classList.add('hidden'); }
    </script>
</body>
</html>
